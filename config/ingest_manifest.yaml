      paths: [action_msgs/msg, action_msgs/srv]

  rcl_interfaces:
    interfaces:
      repo: ros2/rcl_interfaces
      paths: [rcl_interfaces/msg, rcl_interfaces/srv]

  rviz2:
    main_docs:
      - Tutorials/Intermediate/RViz/RViz-Main
      - Tutorials/Intermediate/RViz/RViz-User-Guide/RViz-User-Guide

  realsense2_camera:
    readme:
      repo: realsenseai/realsense-ros
      ref: ros2-development  # no distro branches; ROS2 line lives on this branch
