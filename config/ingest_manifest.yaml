      repo: ros-perception/image_common

  cv_bridge:
    readme:
      repo: ros-perception/vision_opencv
      path: cv_bridge/README.md

  geometry_msgs:
    interfaces:
      repo: ros2/common_interfaces
      paths: [geometry_msgs/msg]

  sensor_msgs:
